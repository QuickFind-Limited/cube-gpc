cubes:
  - name: inventory_worksheet_line
    sql_table: gpc_data_2026_01_26.inventory_worksheet_line
    title: Inventory Worksheet Lines
    description: >
      Inventory worksheet line items representing inventory cost adjustments.
      These are paired adjustments that remove old cost and add new cost for items.
      Grain: one row per inventory worksheet line item (cost adjustment).

    joins:
      - name: items
        relationship: many_to_one
        sql: "{CUBE}.item = {items}.item_id"

      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations}.location_id"

      - name: departments
        relationship: many_to_one
        sql: "{CUBE}.department = {departments}.department_id"

    measures:
      - name: inventory_worksheet_line_count
        type: count
        description: Total number of inventory worksheet lines

      - name: total_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: sum
        description: Total quantity adjusted (positive = add, negative = remove)

      - name: total_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: sum
        format: currency
        description: Total cost adjustment amount

      - name: total_netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total net amount of cost adjustments

      - name: total_taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total tax amount (typically not applicable for cost adjustments)

      - name: total_grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total gross amount of cost adjustments

      - name: total_foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total amount in foreign currency

      - name: total_line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: sum
        format: currency
        description: Total line revenue impact from cost adjustments

      - name: avg_rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: avg
        description: Average cost rate per unit

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        description: Line ID (use with transaction for composite key)

      - name: transaction
        sql: "{CUBE}.transaction"
        type: number
        description: Transaction ID for the inventory worksheet

      - name: item
        sql: "{CUBE}.item"
        type: number
        description: Item ID being adjusted

      - name: quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: number
        description: Quantity adjusted (negative = old cost removal, positive = new cost addition)

      - name: rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: number
        description: Unit cost rate for the adjustment

      - name: amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: number
        description: Line amount (quantity × rate)

      - name: netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: number
        description: Net amount after adjustments

      - name: taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: number
        description: Tax amount (typically zero for cost adjustments)

      - name: grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: number
        description: Gross amount including tax

      - name: foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: number
        description: Amount in foreign currency

      - name: location
        sql: "{CUBE}.location"
        type: number
        description: Location ID where adjustment occurred

      - name: class
        sql: "{CUBE}.class"
        type: number
        description: Class ID for cost center classification

      - name: department
        sql: "{CUBE}.department"
        type: number
        description: Department ID for the adjustment

      - name: isclosed
        sql: "{CUBE}.isclosed"
        type: boolean
        description: Indicates if the line is closed

      - name: iscogs
        sql: "{CUBE}.iscogs"
        type: boolean
        description: Indicates if this is a COGS line

      - name: memo
        sql: "{CUBE}.memo"
        type: number
        description: Memo reference ID

      - name: is_sales_line
        sql: "{CUBE}.is_sales_line"
        type: boolean
        description: Indicates if this is a sales line (typically false for cost adjustments)

      - name: line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: number
        description: Revenue impact from the cost adjustment

    segments:
      - name: cost_removals
        sql: "{CUBE}.quantity < 0"
        description: "Lines that remove old cost (negative quantity)"

      - name: cost_additions
        sql: "{CUBE}.quantity > 0"
        description: "Lines that add new cost (positive quantity)"

      - name: cogs_lines
        sql: "{CUBE}.iscogs = true"
        description: "COGS-related adjustment lines"

      - name: closed_lines
        sql: "{CUBE}.isclosed = true"
        description: "Closed worksheet lines"
