cubes:
  - name: employees
    sql_table: gpc_data_2026_01_26.employees
    title: Employees
    description: >
      Employee dimension containing employee master data including sales reps.
      Grain: one row per employee.
      Note: Current schema contains minimal fields (employee_id, employee_number, employee_name, email, is_active).

    measures:
      - name: employee_count
        type: count
        description: Total number of employees

      - name: active_employee_count
        type: count
        sql: employee_id
        filters:
          - sql: "{CUBE}.is_active = true"
        description: Count of active employees only

    dimensions:
      - name: employee_id
        sql: "{CUBE}.employee_id"
        type: number
        primary_key: true
        description: Unique identifier for the employee

      - name: employee_number
        sql: "{CUBE}.employee_number"
        type: string
        description: Employee number or badge identifier

      - name: employee_name
        sql: "{CUBE}.employee_name"
        type: string
        description: Employee full name

      - name: email
        sql: "{CUBE}.email"
        type: string
        description: Employee email address

      - name: is_active
        sql: "{CUBE}.is_active"
        type: boolean
        description: Indicates if the employee is active

    segments:
      - name: active_only
        sql: "{CUBE}.is_active = true"
        description: "Active employees only"

      - name: inactive_only
        sql: "{CUBE}.is_active = false"
        description: "Inactive employees (for historical reporting)"
