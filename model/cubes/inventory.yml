# redeploy_stamp: 2026-02-23T041500Z
cubes:
  - name: inventory
    sql: >
      SELECT
        inv.*
      FROM gpc_prod_native_v1.inventory_current inv
      LEFT JOIN gpc_prod_native_v1.items i
        ON inv.item = i.id
      WHERE inv.location IN (103, 219, 232, 244)
        AND COALESCE(i.itemtype, inv.itemtype) = 'InvtPart'
        AND UPPER(COALESCE(i.itemid, inv.itemid, '')) NOT LIKE '%FRIDGE%'
        AND UPPER(COALESCE(i.itemid, inv.itemid, '')) NOT LIKE '%GCGIFT%'
        AND UPPER(COALESCE(i.itemid, inv.itemid, '')) NOT LIKE '%GRAPHIC_STUFFBAG%'
        AND UPPER(COALESCE(i.custitem_gpc_sections, '')) NOT LIKE '%CONSUMABLE%'
        AND COALESCE(i.subsidiary, '1') = '1'
    title: Inventory
    description: "Current inventory positions from canonical inventory_current table. Scope auto-applies NetSuite SC | Current Inventory 3PLs filters: locations (Lifestyle Sports FC, Bleckmann UK, Wholesale UK, Meteor Space), itemtype InvtPart, item name exclusions (Fridge/GCGIFT/GRAPHIC_STUFFBAG), section exclusion (CONSUMABLE), subsidiary context. IMPORTANT LIMITATION: Inventory remains snapshot-only (not event history). Always disclose source_max_last_transaction_date and snapshot_loaded_at for inventory outputs."

    joins:
      - name: items
        relationship: many_to_one
        sql: "{CUBE}.item = {items.id}"

      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations.id}"

    measures:
      - name: total_stock
        sql: "CAST({CUBE}.calculated_quantity_available AS FLOAT64)"
        type: sum
        description: Total stock (can be negative for backorders)

      - name: available_stock
        sql: "CAST({CUBE}.calculated_quantity_available AS FLOAT64)"
        type: sum
        filters:
          - sql: "{CUBE}.calculated_quantity_available > 0"
        description: Available stock (positive only)

      - name: backorder_units
        sql: "CAST(ABS({CUBE}.calculated_quantity_available) AS FLOAT64)"
        type: sum
        filters:
          - sql: "{CUBE}.calculated_quantity_available < 0"
        description: Backorder units (negative stock as positive number)

      - name: position_count
        type: count
        description: Total number of inventory positions

      - name: sku_count
        sql: "{CUBE}.item"
        type: count_distinct_approx
        description: Number of unique SKUs in inventory

      - name: location_count
        sql: "{CUBE}.location"
        type: count_distinct_approx
        description: Number of locations with inventory (approximate with HyperLogLog)

      - name: zero_stock_positions
        type: count
        filters:
          - sql: "{CUBE}.calculated_quantity_available = 0"
        description: Number of positions with zero stock

      - name: negative_stock_positions
        type: count
        filters:
          - sql: "{CUBE}.calculated_quantity_available < 0"
        description: Number of positions with negative stock

      - name: average_stock_per_position
        sql: "{total_stock} / NULLIF({position_count}, 0)"
        type: number
        description: Average stock per position

      # GMROI Component Measures
      - name: inventory_value_at_cost
        sql: >
          CAST({CUBE}.calculated_quantity_available *
          COALESCE((SELECT MAX(rate) FROM gpc_prod_native_v1.item_receipt_lines irl
                    WHERE irl.item = {CUBE}.item), 0) AS FLOAT64)
        type: sum
        format: currency
        description: "Inventory value at latest receipt cost (for GMROI denominator). Uses most recent item receipt line cost per item."

      # Compatibility aliases:
      # Some consumers (and older prompt logic) refer to these measure names.
      # They are cost-based values (not retail MSRP).
      - name: total_stock_value
        sql: >
          CAST({CUBE}.calculated_quantity_available *
          COALESCE((SELECT MAX(rate) FROM gpc_prod_native_v1.item_receipt_lines irl
                    WHERE irl.item = {CUBE}.item), 0) AS FLOAT64)
        type: sum
        format: currency
        description: Alias for inventory_value_at_cost (total inventory value at cost).

      - name: total_cost_value
        sql: >
          CAST({CUBE}.calculated_quantity_available *
          COALESCE((SELECT MAX(rate) FROM gpc_prod_native_v1.item_receipt_lines irl
                    WHERE irl.item = {CUBE}.item), 0) AS FLOAT64)
        type: sum
        format: currency
        description: Alias for inventory_value_at_cost (total inventory cost value).

      # Sell-through approximation for STR001/PP058
      # Note: Requires joining with transaction_lines for units_sold
      # Formula: Units Sold / (Units Sold + Current Stock)
      # This is calculated at query time by combining measures from both cubes

    dimensions:
      - name: id
        sql: "CONCAT(CAST({CUBE}.item AS STRING), '-', CAST({CUBE}.location AS STRING))"
        type: string
        primary_key: true

      - name: item
        sql: "{CUBE}.item"
        type: number

      - name: itemid
        sql: "{CUBE}.itemid"
        type: string
        title: SKU
        description: Item SKU code

      - name: itemtype
        sql: "{CUBE}.itemtype"
        type: string
        description: Item type from canonical inventory_current snapshot (e.g., InvtPart)

      - name: displayname
        sql: "{CUBE}.displayname"
        type: string
        description: Item display name

      - name: location
        sql: "{CUBE}.location"
        type: number

      - name: quantity
        sql: "{CUBE}.calculated_quantity_available"
        type: number
        description: Quantity available

      - name: stock_asof_date
        sql: "CAST({CUBE}.stock_asof_date AS TIMESTAMP)"
        type: time
        description: Last transaction date for this item-location inventory position.

      - name: source_max_last_transaction_date
        sql: "CAST({CUBE}.source_max_last_transaction_date AS TIMESTAMP)"
        type: time
        description: Maximum stock_asof_date present in the inventory snapshot source.

      - name: snapshot_loaded_at
        sql: "CAST({CUBE}.snapshot_loaded_at AS TIMESTAMP)"
        type: time
        description: Timestamp when inventory_current was materialized in BigQuery.

      - name: source_table
        sql: "{CUBE}.source_table"
        type: string
        description: Source lineage marker for this inventory snapshot row.

      - name: stock_status
        sql: >
          CASE
            WHEN {CUBE}.calculated_quantity_available > 0 THEN 'In Stock'
            WHEN {CUBE}.calculated_quantity_available = 0 THEN 'Zero Stock'
            ELSE 'Backorder'
          END
        type: string
        description: Stock status category

    segments:
      - name: positive_stock
        sql: "{CUBE}.calculated_quantity_available > 0"

      - name: zero_stock
        sql: "{CUBE}.calculated_quantity_available = 0"

      - name: backorder
        sql: "{CUBE}.calculated_quantity_available < 0"

    pre_aggregations:
      # Snapshot metadata rollup for freshness/lineage checks in rollup-only mode
      - name: inventory_snapshot_metadata
        measures:
          - position_count
          - sku_count
          - total_stock
          - available_stock
        dimensions:
          - source_table
          - source_max_last_transaction_date
          - snapshot_loaded_at
        refresh_key:
          every: 365 days

      # Inventory analysis by location and item attributes
      - name: inventory_analysis
        measures:
          - total_stock
          - available_stock
          - backorder_units
          - position_count
          - sku_count
          - location_count
          - zero_stock_positions
          - negative_stock_positions
          - inventory_value_at_cost
          - total_stock_value
          - total_cost_value
        dimensions:
          - location
          - stock_status
          - itemtype
          - items.itemtype
          - items.category
          - items.category_base
          - items.section
          - items.season
          - items.size
          - items.range
          - items.markdown
          - items.is_markdown
          - locations.name
          - locations.region         # ← ADDED: Enable filtering by region (IRELAND, UK, EU, GLOBAL)
          - locations.channel_type   # ← ADDED: Enable filtering by channel (D2C, RETAIL, B2B_WHOLESALE, etc.)
          - locations.location_type  # ← ADDED: Enable filtering by type (RETAIL, FULFILLMENT, etc.)
        refresh_key:
          every: 365 days

      # Item-level inventory (for SKU lookups)
      - name: item_inventory
        measures:
          - total_stock
          - available_stock
          - backorder_units
          - position_count
          - inventory_value_at_cost
          - total_stock_value
          - total_cost_value
        dimensions:
          - item
          - itemid
          - location
        refresh_key:
          every: 365 days
