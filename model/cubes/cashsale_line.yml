cubes:
  - name: cashsale_line
    sql_table: gpc_data_2026_01_26.cashsale_line
    title: Cash Sale Lines
    description: >
      Cash sale line item details for POS transactions.
      Grain: one row per cash sale line item.
      Note: Contains multi-line structure with revenue lines (is_sales_line=true) and COGS entries (iscogs=true).
      100% system entity contamination - requires join to transaction headers for entity filtering.

    joins:
      - name: items
        relationship: many_to_one
        sql: "{CUBE}.item = {items}.item_id"

      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations}.location_id"

      - name: departments
        relationship: many_to_one
        sql: "{CUBE}.department = {departments}.department_id"

      - name: transactions
        relationship: many_to_one
        sql: "{CUBE}.transaction = {transactions}.id"

    measures:
      - name: cashsale_line_count
        type: count
        description: Total number of cash sale lines

      - name: total_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: sum
        description: Total quantity across all lines

      - name: total_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: sum
        format: currency
        description: Total line amount (quantity * rate)

      - name: total_netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total net amount (after discounts, before tax)

      - name: total_taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total tax amount

      - name: total_grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total gross amount (including tax)

      - name: total_foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total amount in foreign currency

      - name: total_line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: sum
        format: currency
        description: Total revenue from sales lines only

      - name: avg_rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: avg
        description: Average unit rate/price

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        description: Line identifier (not unique across transactions)

      - name: transaction
        sql: "{CUBE}.transaction"
        type: number
        description: Transaction ID reference

      - name: item
        sql: "{CUBE}.item"
        type: number
        description: Item/product ID reference

      - name: quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: number
        description: Line quantity (negative indicates COGS entries)

      - name: rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: number
        description: Unit price/rate

      - name: amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: number
        description: Line amount (quantity * rate)

      - name: netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: number
        description: Net amount (after discounts, before tax)

      - name: taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: number
        description: Tax amount for this line

      - name: grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: number
        description: Gross amount (including tax)

      - name: foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: number
        description: Amount in foreign currency

      - name: location
        sql: "{CUBE}.location"
        type: number
        description: Location ID reference

      - name: class
        sql: "{CUBE}.class"
        type: number
        description: Class ID reference

      - name: department
        sql: "{CUBE}.department"
        type: number
        description: Department ID reference

      - name: isclosed
        sql: "{CUBE}.isclosed"
        type: boolean
        description: Indicates if the line is closed

      - name: iscogs
        sql: "{CUBE}.iscogs"
        type: boolean
        description: Indicates if this is a cost of goods sold line

      - name: memo
        sql: "{CUBE}.memo"
        type: number
        description: Memo reference

      - name: is_sales_line
        sql: "{CUBE}.is_sales_line"
        type: boolean
        description: Indicates if this is a revenue/sales line

      - name: line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: number
        description: Revenue amount for sales lines

    segments:
      - name: sales_lines_only
        sql: "{CUBE}.is_sales_line = true"
        description: "Revenue lines only (excludes COGS entries)"

      - name: cogs_lines_only
        sql: "{CUBE}.iscogs = true"
        description: "Cost of goods sold lines only"

      - name: revenue_lines
        sql: "{CUBE}.is_sales_line = true AND {CUBE}.iscogs = false"
        description: "Pure revenue lines (excludes COGS)"

      - name: closed_lines
        sql: "{CUBE}.isclosed = true"
        description: "Closed lines only"

    pre_aggregations:
      - name: daily_rollup
        type: rollup
        external: true
        measures:
          - cashsale_line_count
          - total_quantity
          - total_amount
          - total_netamount
          - total_taxamount
          - total_grossamount
          - total_foreignamount
          - total_line_revenue
        dimensions:
          - item
          - location
          - department
          - is_sales_line
          - iscogs
        refresh_key:
          every: 24 hour
