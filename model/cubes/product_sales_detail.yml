# redeploy_stamp: 2026-02-23T041500Z
cubes:
  - name: product_sales_detail
    sql: >
      SELECT *
      FROM gpc_prod_native_v1.transaction_lines_denormalized_mv
      WHERE product_name IS NOT NULL
        AND TRIM(product_name) != ''
    title: Product Sales Detail
    description: Product-level sales metrics (PRD-001, PRD-002). Supports product-level ranking plus product + context breakdowns (country/location/channel) via dedicated pre-aggregations.

    joins:
      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations.id}"

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true

      - name: product_name
        sql: product_name
        type: string
        description: "Product display name (3,000+ unique products)"

      - name: sku
        sql: sku
        type: string
        description: "Product SKU code (3,000+ unique SKUs)"

      - name: transaction_date
        sql: >
          CAST(
            COALESCE(
              SAFE_CAST(CAST(transaction_date AS STRING) AS DATE),
              CAST(SAFE_CAST(CAST(transaction_date AS STRING) AS TIMESTAMP) AS DATE),
              SAFE.PARSE_DATE('%Y-%m-%d', CAST(transaction_date AS STRING)),
              SAFE.PARSE_DATE('%d/%m/%Y', CAST(transaction_date AS STRING)),
              SAFE.PARSE_DATE('%m/%d/%Y', CAST(transaction_date AS STRING))
            ) AS TIMESTAMP
          )
        type: time
        description: "Parsed transaction date with mixed-format tolerance"

      - name: location
        sql: location
        type: number
        description: "Location internal id"

      - name: location_name
        sql: location_name
        type: string
        description: "Location name for product x location breakdowns"

      - name: channel_type
        sql: "{locations.channel_type}"
        type: string
        description: "Channel type from locations cube (D2C/RETAIL/B2B/PARTNER/EVENTS/OTHER)"

      - name: billing_country
        sql: billing_country
        type: string
        description: "Billing country for product x geography breakdowns"

      - name: category
        sql: category
        type: string
        description: "Product category"

      - name: section
        sql: section
        type: string
        description: "Product section"

    measures:
      - name: total_revenue
        sql: "CAST(CASE WHEN transaction_type IN ('CustInvc', 'CashSale') THEN amount * -1 ELSE 0 END AS FLOAT64)"
        type: sum
        format: currency
        description: "Total revenue (gross, includes VAT). Multiplied by -1 to convert NetSuite's negative amounts to positive."

      - name: units_sold
        sql: >
          CAST(CASE
            WHEN transaction_type IN ('CustInvc', 'CashSale') THEN quantity * -1
            ELSE 0
          END AS FLOAT64)
        type: sum
        description: "Units sold (positive values). Multiplied by -1 to convert NetSuite's negative quantities to positive."

      - name: units_returned
        sql: >
          CAST(CASE
            WHEN transaction_type IN ('CustCred', 'RtnAuth') THEN ABS(quantity)
            ELSE 0
          END AS FLOAT64)
        type: sum
        description: "Units returned (from credits/return auths)"

      - name: line_count
        type: count
        description: "Number of transaction lines"

    pre_aggregations:
      - name: product_daily_sales
        measures:
          - total_revenue
          - units_sold
          - units_returned
          - line_count
        dimensions:
          - product_name
          - sku
          - transaction_date
        time_dimension: transaction_date
        granularity: day
        partition_granularity: month
        type: rollup
        build_range_start:
          sql: SELECT '2022-01-01'
        refresh_key:
          every: 1 hour
          incremental: true
          update_window: 28 day

      # Product + context rollup for PRD-001/PRD-002 with channel/country/location asks.
      # Month granularity keeps cardinality manageable while still supporting period trends.
      - name: product_context_monthly
        measures:
          - total_revenue
          - units_sold
          - units_returned
          - line_count
        dimensions:
          - product_name
          - sku
          - category
          - section
          - billing_country
          - location_name
          - channel_type
          - transaction_date
        time_dimension: transaction_date
        granularity: month
        partition_granularity: month
        type: rollup
        build_range_start:
          sql: SELECT '2022-01-01'
        refresh_key:
          every: 1 hour
          incremental: true
          update_window: 28 day
    segments:
      - name: sales_lines
        sql: "{CUBE}.transaction_type IN ('CustInvc', 'CashSale')"
        description: "Only sales transactions (exclude returns)"

      - name: return_lines
        sql: "{CUBE}.transaction_type IN ('CustCred', 'RtnAuth')"
        description: "Only return transactions"
