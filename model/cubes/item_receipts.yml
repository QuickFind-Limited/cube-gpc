# redeploy_stamp: 2026-02-23T041500Z
cubes:
  - name: item_receipts
    sql_table: gpc_prod_native_v1.item_receipts

    title: Item Receipts
    description: Item receipt transaction headers (goods received from suppliers)

    measures:
      - name: receipt_count
        type: count
        description: Number of item receipts

      - name: total_receipt_value
        sql: "SAFE_CAST({CUBE}.total AS FLOAT64)"
        type: sum
        format: currency
        description: Total receipt value in base currency

      - name: avg_receipt_value
        sql: "SAFE_CAST({CUBE}.total AS FLOAT64)"
        type: avg
        format: currency
        description: Average receipt value

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
        public: false

      - name: tranid
        sql: tranid
        type: string
        title: Receipt Number
        description: Item receipt transaction number

      - name: trandate
        sql: trandate
        type: time
        title: Receipt Date
        description: Date of receipt

      - name: receipt_date
        sql: >
          CAST(
            COALESCE(
              SAFE_CAST(CAST({CUBE}.trandate AS STRING) AS DATE),
              CAST(SAFE_CAST(CAST({CUBE}.trandate AS STRING) AS TIMESTAMP) AS DATE),
              SAFE.PARSE_DATE('%Y-%m-%d', CAST({CUBE}.trandate AS STRING)),
              SAFE.PARSE_DATE('%d/%m/%Y', CAST({CUBE}.trandate AS STRING))
            ) AS TIMESTAMP
          )
        type: time
        public: false
        description: Parsed receipt date used for pre-aggregations

      - name: supplier
        sql: entity
        type: number
        title: Supplier ID
        description: Vendor entity ID

      - name: currency
        sql: currency
        type: string
        title: Currency
        description: Transaction currency code

      - name: exchangerate
        sql: exchangerate
        type: number
        title: Exchange Rate
        description: Currency exchange rate to base currency

      - name: memo
        sql: memo
        type: string
        title: Memo
        description: Receipt memo field

    joins:
      - name: item_receipt_lines
        relationship: one_to_many
        sql: "{CUBE}.id = {item_receipt_lines}.receipt_id"

      - name: vendors
        relationship: many_to_one
        sql: "{CUBE}.entity = {vendors}.id"

    pre_aggregations:
      - name: receipt_analysis
        measures:
          - receipt_count
          - total_receipt_value
        dimensions:
          - supplier
          - currency
        time_dimension: receipt_date
        granularity: day
        partition_granularity: month
        build_range_start:
          sql: SELECT '2022-01-01'
        refresh_key:
          every: 365 days
          incremental: true
          update_window: 28 day
