cubes:
  - name: customer_deposit_line
    sql_table: gpc_data_2026_01_26.customer_deposit_line
    title: Customer Deposit Lines
    description: >
      Customer deposit line items showing payment deposits received from customers.
      Grain: one row per customer deposit line item.
      Note: This table contains 100% webstore entity contamination per analysis.
      All amounts are negative (deposit receipts). Single-line per transaction structure.

    joins:
      - name: items
        relationship: many_to_one
        sql: "{CUBE}.item = {items}.item_id"

      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations}.location_id"

      - name: departments
        relationship: many_to_one
        sql: "{CUBE}.department = {departments}.department_id"

    measures:
      - name: customer_deposit_line_count
        type: count
        description: Total number of customer deposit lines

      - name: total_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: sum
        description: Total quantity across all deposit lines

      - name: total_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: sum
        format: currency
        description: Total amount (negative values indicate deposits received)

      - name: total_amount_abs
        sql: "ABS(CAST({CUBE}.amount AS FLOAT64))"
        type: sum
        format: currency
        description: Absolute value of total deposit amount

      - name: total_netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total net amount

      - name: total_netamount_abs
        sql: "ABS(CAST({CUBE}.netamount AS FLOAT64))"
        type: sum
        format: currency
        description: Absolute value of total net amount

      - name: total_taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total tax amount

      - name: total_grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total gross amount

      - name: total_foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total foreign currency amount

      - name: total_line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: sum
        format: currency
        description: Total line revenue

      - name: avg_rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: avg
        description: Average rate per deposit line

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        description: Line ID (part of composite primary key with transaction)

      - name: transaction
        sql: "{CUBE}.transaction"
        type: number
        primary_key: true
        description: Transaction ID (part of composite primary key with id)

      - name: item
        sql: "{CUBE}.item"
        type: number
        description: Item ID (foreign key to items table)

      - name: quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: number
        description: Line item quantity

      - name: rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: number
        description: Rate per unit

      - name: amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: number
        description: Line amount (negative for deposits)

      - name: netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: number
        description: Net amount

      - name: taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: number
        description: Tax amount

      - name: grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: number
        description: Gross amount

      - name: foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: number
        description: Foreign currency amount

      - name: location
        sql: "{CUBE}.location"
        type: number
        description: Location ID (foreign key to locations table)

      - name: class
        sql: "{CUBE}.class"
        type: number
        description: Class ID

      - name: department
        sql: "{CUBE}.department"
        type: number
        description: Department ID (foreign key to departments table)

      - name: isclosed
        sql: "{CUBE}.isclosed"
        type: boolean
        description: Indicates if the deposit line is closed

      - name: iscogs
        sql: "{CUBE}.iscogs"
        type: boolean
        description: Indicates if this is a cost of goods sold line

      - name: memo
        sql: "{CUBE}.memo"
        type: number
        description: Memo ID reference

      - name: is_sales_line
        sql: "{CUBE}.is_sales_line"
        type: boolean
        description: Indicates if this is a sales line

      - name: line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: number
        description: Line revenue amount

    segments:
      - name: sales_lines_only
        sql: "{CUBE}.is_sales_line = true"
        description: "Filter to sales lines only"

      - name: cogs_lines_only
        sql: "{CUBE}.iscogs = true"
        description: "Filter to COGS lines only"

      - name: open_lines
        sql: "{CUBE}.isclosed = false"
        description: "Filter to open deposit lines"

      - name: closed_lines
        sql: "{CUBE}.isclosed = true"
        description: "Filter to closed deposit lines"

    pre_aggregations:
      - name: daily_summary
        type: rollup
        external: true
        measures:
          - customer_deposit_line_count
          - total_amount
          - total_netamount
          - total_taxamount
          - total_line_revenue
        dimensions:
          - item
          - location
          - department
          - is_sales_line
          - iscogs
        refresh_key:
          every: 24 hour
