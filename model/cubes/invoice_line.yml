cubes:
  - name: invoice_line
    sql_table: gpc_data_2026_01_26.invoice_line
    title: Invoice Lines
    description: >
      Invoice line items fact table containing detailed line-level information for customer invoices.
      Grain: one row per invoice line item.
      Note: All amounts are negative per NetSuite credit memo convention. Contains 99.4% webstore/POS system entity transactions.

    joins:
      - name: items
        relationship: many_to_one
        sql: "{CUBE}.item = {items}.item_id"

      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations}.location_id"

      - name: departments
        relationship: many_to_one
        sql: "{CUBE}.department = {departments}.department_id"

    measures:
      - name: invoice_line_count
        type: count
        description: Total number of invoice line items

      - name: total_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: sum
        description: Total quantity across all invoice lines

      - name: total_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: sum
        format: currency
        description: Total amount (line-level)

      - name: total_amount_abs
        sql: "ABS(CAST({CUBE}.amount AS FLOAT64))"
        type: sum
        format: currency
        description: Total absolute amount (for reporting positive values)

      - name: total_netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total net amount after discounts

      - name: total_netamount_abs
        sql: "ABS(CAST({CUBE}.netamount AS FLOAT64))"
        type: sum
        format: currency
        description: Total absolute net amount

      - name: total_taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total tax amount

      - name: total_taxamount_abs
        sql: "ABS(CAST({CUBE}.taxamount AS FLOAT64))"
        type: sum
        format: currency
        description: Total absolute tax amount

      - name: total_grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total gross amount (including tax)

      - name: total_grossamount_abs
        sql: "ABS(CAST({CUBE}.grossamount AS FLOAT64))"
        type: sum
        format: currency
        description: Total absolute gross amount

      - name: total_foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total foreign currency amount

      - name: total_foreignamount_abs
        sql: "ABS(CAST({CUBE}.foreignamount AS FLOAT64))"
        type: sum
        format: currency
        description: Total absolute foreign currency amount

      - name: total_line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: sum
        format: currency
        description: Total line revenue

      - name: total_line_revenue_abs
        sql: "ABS(CAST({CUBE}.line_revenue AS FLOAT64))"
        type: sum
        format: currency
        description: Total absolute line revenue

      - name: avg_rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: avg
        format: currency
        description: Average unit rate/price

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        description: Line item ID (part of composite primary key with transaction)

      - name: transaction
        sql: "{CUBE}.transaction"
        type: number
        description: Transaction ID (foreign key to invoice header)

      - name: item
        sql: "{CUBE}.item"
        type: number
        description: Item/product ID

      - name: quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: number
        description: Line item quantity

      - name: rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: number
        description: Unit rate/price

      - name: amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: number
        description: Line amount (quantity × rate)

      - name: netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: number
        description: Net amount after discounts

      - name: taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: number
        description: Tax amount for this line

      - name: grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: number
        description: Gross amount including tax

      - name: foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: number
        description: Amount in foreign currency

      - name: location
        sql: "{CUBE}.location"
        type: number
        description: Location ID (warehouse/store)

      - name: class
        sql: "{CUBE}.class"
        type: number
        description: Class/product line ID

      - name: department
        sql: "{CUBE}.department"
        type: number
        description: Department/channel ID

      - name: isclosed
        sql: "{CUBE}.isclosed"
        type: boolean
        description: Indicates if line is closed

      - name: iscogs
        sql: "{CUBE}.iscogs"
        type: boolean
        description: Indicates if this is a COGS (cost of goods sold) line

      - name: memo
        sql: "{CUBE}.memo"
        type: number
        description: Memo reference ID

      - name: is_sales_line
        sql: "{CUBE}.is_sales_line"
        type: boolean
        description: Indicates if this is a sales line (vs tax/discount line)

      - name: line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: number
        description: Revenue amount for this line

    segments:
      - name: sales_lines_only
        sql: "{CUBE}.is_sales_line = true"
        description: "Filter to sales lines only (excludes tax and discount lines)"

      - name: cogs_lines_only
        sql: "{CUBE}.iscogs = true"
        description: "Filter to COGS lines only"

      - name: revenue_lines_only
        sql: "{CUBE}.is_sales_line = true AND {CUBE}.iscogs = false"
        description: "Filter to revenue lines (excludes COGS and tax lines)"

      - name: open_lines
        sql: "{CUBE}.isclosed = false"
        description: "Filter to open/unfulfilled lines"

      - name: closed_lines
        sql: "{CUBE}.isclosed = true"
        description: "Filter to closed/fulfilled lines"

    pre_aggregations:
      - name: invoice_lines_by_item_daily
        type: rollup
        external: true
        measures:
          - invoice_line_count
          - total_quantity
          - total_amount_abs
          - total_netamount_abs
          - total_line_revenue_abs
        dimensions:
          - item
          - department
          - location
          - is_sales_line
          - iscogs
        refresh_key:
          every: "24 hour"
