# redeploy_stamp: 2026-02-23T041500Z
cubes:
  - name: purchase_orders
    sql_table: gpc_prod_native_v1.purchase_orders

    title: Purchase Orders
    description: Purchase order transaction headers from suppliers

    measures:
      - name: po_count
        type: count
        description: Number of purchase orders

      - name: total_po_value
        sql: total
        type: sum
        format: currency
        description: Total PO value in EUR (base currency)

      - name: avg_po_value
        sql: "{total_po_value} / NULLIF({po_count}, 0)"
        type: number
        format: currency
        public: false
        description: Average PO value (calculated from components, NOT for use in pre-aggregations)

      - name: pending_receipt_count
        type: count
        filters:
          - sql: "{CUBE}.status = 'B'"
        description: POs pending receipt (status B)

      - name: partially_received_count
        type: count
        filters:
          - sql: "{CUBE}.status = 'D'"
        description: POs partially received (status D)

      - name: pending_billing_count
        type: count
        filters:
          - sql: "{CUBE}.status = 'E'"
        description: POs pending billing (status E)

      - name: open_po_count
        type: count
        filters:
          - sql: "{CUBE}.status IN ('B', 'D', 'E')"
        description: Open POs (pending receipt, partially received, or pending billing)

    dimensions:
      - name: id
        sql: id
        type: number
        primary_key: true
        public: false

      - name: tranid
        sql: tranid
        type: string
        title: PO Number
        description: Purchase order transaction number

      - name: trandate
        # BigQuery column is DATE; cast to TIMESTAMP to avoid Cube generating
        # DATETIME(date, 'UTC') (invalid in BigQuery).
        sql: "CAST({CUBE}.trandate AS TIMESTAMP)"
        type: time
        title: PO Date
        description: Purchase order transaction date

      - name: status
        sql: status
        type: string
        title: PO Status
        description: Purchase order status code (A=Pending Approval, B=Pending Receipt, D=Partially Received, E=Pending Billing, F=Fully Billed, G=Closed)

      - name: supplier
        sql: entity
        type: number
        title: Supplier ID
        description: Vendor entity ID

      - name: location
        sql: location
        type: number
        title: Receiving Location ID
        description: Receiving/location ID on the PO header

      - name: location_name
        sql: "{locations.name}"
        type: string
        title: Receiving Location
        description: Receiving/location name (from locations join)

      - name: currency
        sql: currency
        type: number
        title: Currency
        description: Transaction currency ID

      - name: exchangerate
        sql: exchangerate
        type: number
        title: Exchange Rate
        description: Currency exchange rate to base currency

      - name: foreigntotal
        sql: foreigntotal
        type: number
        format: currency
        title: Foreign Total
        description: Total in foreign currency

      - name: memo
        sql: memo
        type: string
        title: Memo
        description: PO memo field

    joins:
      - name: purchase_order_lines
        relationship: one_to_many
        sql: "{CUBE}.id = {purchase_order_lines.po_id}"

      - name: vendors
        relationship: many_to_one
        sql: "{CUBE}.entity = {vendors.id}"

      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations.id}"

    pre_aggregations:
      # Totals rollup (rollup-only safe for scalar queries with date filters)
      - name: po_totals
        measures:
          - po_count
          - total_po_value
          # avg_po_value removed - calculate at query time from total_po_value / po_count
          - pending_receipt_count
          - partially_received_count
          - pending_billing_count
          - open_po_count
        time_dimension: trandate
        granularity: day
        partition_granularity: month
        build_range_start:
          sql: SELECT '2022-01-01'
        build_range_end:
          sql: >
            SELECT CAST(
              MAX(
                CAST(
                  COALESCE(
                    SAFE_CAST(CAST(trandate AS STRING) AS DATE),
                    CAST(SAFE_CAST(CAST(trandate AS STRING) AS TIMESTAMP) AS DATE),
                    SAFE.PARSE_DATE('%Y-%m-%d', CAST(trandate AS STRING)),
                    SAFE.PARSE_DATE('%d/%m/%Y', CAST(trandate AS STRING)),
                    SAFE.PARSE_DATE('%m/%d/%Y', CAST(trandate AS STRING))
                  ) AS TIMESTAMP
                )
              ) AS STRING
            )
            FROM gpc_prod_native_v1.purchase_orders
        refresh_key:
          every: 1 hour
          incremental: true
          update_window: 28 day
      # Breakdown rollup for supplier/location analysis (PO001/PO002/OOI* use cases)
      - name: po_summary
        measures:
          - po_count
          - total_po_value
          - pending_receipt_count
          - partially_received_count
          - pending_billing_count
          - open_po_count
        dimensions:
          - status
          - supplier
          - location
          - locations.name
          - vendors.vendor_name
          - vendors.factory_code      # PO002 fix
          - vendors.company_name      # PO002 fix
        time_dimension: trandate
        granularity: day
        partition_granularity: month
        build_range_start:
          sql: SELECT '2022-01-01'
        build_range_end:
          sql: >
            SELECT CAST(
              MAX(
                CAST(
                  COALESCE(
                    SAFE_CAST(CAST(trandate AS STRING) AS DATE),
                    CAST(SAFE_CAST(CAST(trandate AS STRING) AS TIMESTAMP) AS DATE),
                    SAFE.PARSE_DATE('%Y-%m-%d', CAST(trandate AS STRING)),
                    SAFE.PARSE_DATE('%d/%m/%Y', CAST(trandate AS STRING)),
                    SAFE.PARSE_DATE('%m/%d/%Y', CAST(trandate AS STRING))
                  ) AS TIMESTAMP
                )
              ) AS STRING
            )
            FROM gpc_prod_native_v1.purchase_orders
        refresh_key:
          every: 1 hour
          incremental: true
          update_window: 28 day
