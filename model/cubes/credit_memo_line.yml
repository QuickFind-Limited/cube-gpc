cubes:
  - name: credit_memo_line
    sql_table: gpc_data_2026_01_26.credit_memo_line
    title: Credit Memo Lines
    description: >
      Credit memo line items containing product returns and revenue reversals.
      Grain: one row per credit memo line item. Contains 92,585 rows with negative amounts
      indicating customer refunds. Includes COGS line pairing structure for inventory items.

    joins:
      - name: items
        relationship: many_to_one
        sql: "{CUBE}.item = {items}.item_id"

      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations}.location_id"

      - name: departments
        relationship: many_to_one
        sql: "{CUBE}.department = {departments}.department_id"

    measures:
      - name: credit_memo_line_count
        type: count
        description: Total number of credit memo line items

      - name: total_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: sum
        description: Total quantity of items credited

      - name: total_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: sum
        format: currency
        description: Total credit amount before tax

      - name: total_netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total net credit amount

      - name: total_taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total tax amount credited

      - name: total_grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total gross credit amount including tax

      - name: total_foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total credit amount in foreign currency

      - name: total_line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: sum
        format: currency
        description: Total line-level revenue impact (negative for credits)

      - name: avg_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: avg
        description: Average quantity per credit line

      - name: avg_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: avg
        format: currency
        description: Average credit amount per line

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        description: Line item identifier (part of composite key with transaction)

      - name: transaction
        sql: "{CUBE}.transaction"
        type: number
        description: Transaction ID reference to credit memo header

      - name: item
        sql: "{CUBE}.item"
        type: number
        description: Item/product ID being credited

      - name: quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: number
        description: Quantity of items being credited

      - name: rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: number
        description: Unit price/rate for the credited item

      - name: amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: number
        description: Line amount before tax (typically negative for credits)

      - name: netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: number
        description: Net line amount

      - name: taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: number
        description: Tax amount for this line

      - name: grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: number
        description: Gross line amount including tax

      - name: foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: number
        description: Amount in foreign currency

      - name: location
        sql: "{CUBE}.location"
        type: number
        description: Location/warehouse ID

      - name: class
        sql: "{CUBE}.class"
        type: number
        description: Class/category ID for reporting

      - name: department
        sql: "{CUBE}.department"
        type: number
        description: Department ID for organizational reporting

      - name: isclosed
        sql: "{CUBE}.isclosed"
        type: boolean
        description: Indicates if the line is closed

      - name: iscogs
        sql: "{CUBE}.iscogs"
        type: boolean
        description: Indicates if this is a COGS (cost of goods sold) line

      - name: memo
        sql: "{CUBE}.memo"
        type: number
        description: Memo reference ID

      - name: is_sales_line
        sql: "{CUBE}.is_sales_line"
        type: boolean
        description: Indicates if this is a sales/revenue line (vs COGS or tax)

      - name: line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: number
        description: Revenue impact for this line

    segments:
      - name: revenue_lines
        sql: "{CUBE}.is_sales_line = TRUE"
        description: "Revenue/customer-facing credit lines only (excludes COGS and tax lines)"

      - name: cogs_lines
        sql: "{CUBE}.iscogs = TRUE"
        description: "COGS lines only for inventory accounting"

      - name: closed_lines
        sql: "{CUBE}.isclosed = TRUE"
        description: "Closed credit memo lines"

      - name: open_lines
        sql: "{CUBE}.isclosed = FALSE"
        description: "Open credit memo lines"

    pre_aggregations:
      - name: daily_credits
        type: rollup
        external: true
        measures:
          - credit_memo_line_count
          - total_amount
          - total_netamount
          - total_taxamount
          - total_grossamount
          - total_quantity
          - total_line_revenue
        dimensions:
          - item
          - location
          - department
          - iscogs
          - is_sales_line
        refresh_key:
          every: "24 hour"
