cubes:
  - name: inventory_adjustment_line
    sql_table: gpc_data_2026_01_26.inventory_adjustment_line
    title: Inventory Adjustment Lines
    description: >
      Inventory adjustment line items capturing quantity and value adjustments to inventory.
      Grain: one row per inventory adjustment line item.

    joins:
      - name: items
        relationship: many_to_one
        sql: "{CUBE}.item = {items}.item_id"

      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations}.location_id"

      - name: departments
        relationship: many_to_one
        sql: "{CUBE}.department = {departments}.department_id"

    measures:
      - name: inventory_adjustment_line_count
        type: count
        description: Total number of inventory adjustment lines

      - name: total_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: sum
        description: Total adjustment quantity (positive = increase, negative = decrease)

      - name: total_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: sum
        format: currency
        description: Total adjustment amount

      - name: total_netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total net adjustment amount

      - name: total_taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total tax amount

      - name: total_grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total gross adjustment amount

      - name: total_foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total foreign currency amount

      - name: total_line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: sum
        format: currency
        description: Total line revenue

      - name: avg_adjustment_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: avg
        description: Average adjustment quantity per line

      - name: avg_adjustment_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: avg
        format: currency
        description: Average adjustment amount per line

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        description: Line item identifier

      - name: transaction
        sql: "{CUBE}.transaction"
        type: number
        description: Transaction ID for the inventory adjustment

      - name: item
        sql: "{CUBE}.item"
        type: number
        description: Item ID being adjusted

      - name: quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: number
        description: Adjustment quantity (positive = increase, negative = decrease)

      - name: rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: number
        description: Rate per unit

      - name: amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: number
        description: Adjustment amount

      - name: netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: number
        description: Net adjustment amount

      - name: taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: number
        description: Tax amount

      - name: grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: number
        description: Gross adjustment amount

      - name: foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: number
        description: Foreign currency amount

      - name: location
        sql: "{CUBE}.location"
        type: number
        description: Location ID where adjustment occurred

      - name: class
        sql: "{CUBE}.class"
        type: number
        description: Class ID

      - name: department
        sql: "{CUBE}.department"
        type: number
        description: Department ID

      - name: isclosed
        sql: "{CUBE}.isclosed"
        type: boolean
        description: Indicates if the adjustment line is closed

      - name: iscogs
        sql: "{CUBE}.iscogs"
        type: boolean
        description: Indicates if this is a COGS (cost of goods sold) line

      - name: memo
        sql: "{CUBE}.memo"
        type: number
        description: Memo reference ID

      - name: is_sales_line
        sql: "{CUBE}.is_sales_line"
        type: boolean
        description: Indicates if this is a sales line

      - name: line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: number
        description: Line revenue amount

    segments:
      - name: inventory_lines
        sql: "{CUBE}.iscogs = false"
        description: "Inventory adjustment lines (non-COGS)"

      - name: cogs_lines
        sql: "{CUBE}.iscogs = true"
        description: "COGS adjustment lines"

      - name: positive_adjustments
        sql: "CAST({CUBE}.quantity AS FLOAT64) > 0"
        description: "Positive quantity adjustments (inventory increases)"

      - name: negative_adjustments
        sql: "CAST({CUBE}.quantity AS FLOAT64) < 0"
        description: "Negative quantity adjustments (inventory decreases)"

      - name: closed_lines
        sql: "{CUBE}.isclosed = true"
        description: "Closed adjustment lines"

    pre_aggregations:
      - name: daily_adjustments
        type: rollup
        external: true
        measures:
          - inventory_adjustment_line_count
          - total_quantity
          - total_amount
          - total_netamount
        dimensions:
          - iscogs
          - isclosed
        refresh_key:
          every: "24 hour"
