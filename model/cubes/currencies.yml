cubes:
  - name: currencies
    sql_table: gpc_data_2026_01_26.currencies
    title: Currencies
    description: Currency reference data with exchange rates for multi-currency support

    measures:
      - name: currency_count
        type: count
        description: Total number of currencies

      - name: avg_exchange_rate
        sql: "CAST({CUBE}.exchange_rate AS FLOAT64)"
        type: avg
        description: Average exchange rate across currencies

    dimensions:
      - name: currency_id
        sql: "{CUBE}.currency_id"
        type: number
        primary_key: true
        description: Unique identifier for the currency

      - name: currency_code
        sql: "{CUBE}.currency_code"
        type: string
        description: Currency code (EUR, GBP, USD, etc.)

      - name: currency_symbol
        sql: "{CUBE}.currency_symbol"
        type: string
        description: Currency symbol

      - name: exchange_rate
        sql: "CAST({CUBE}.exchange_rate AS FLOAT64)"
        type: number
        description: Exchange rate relative to base currency

      - name: is_active
        sql: "{CUBE}.is_active"
        type: boolean
        description: Indicates if the currency is active

      - name: is_base_currency
        sql: "{CUBE}.exchange_rate = 1.0"
        type: boolean
        description: Indicates if this is the base currency for the organization (exchange rate = 1)

    segments:
      - name: active_currencies
        sql: "{CUBE}.is_active = true"
        description: "Active currencies only"

      - name: base_currency
        sql: "{CUBE}.exchange_rate = 1.0"
        description: "The organization's base currency"

    pre_aggregations:
      - name: currency_analysis
        type: rollup
        measures:
          - currency_count
        dimensions:
          - currency_code
        refresh_key:
          every: 1 day
