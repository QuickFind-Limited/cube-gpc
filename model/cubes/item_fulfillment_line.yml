cubes:
  - name: item_fulfillment_line
    sql_table: gpc_data_2026_01_26.item_fulfillment_line
    title: Item Fulfillment Lines
    description: >
      Item fulfillment line-level detail for shipped orders.
      Grain: one row per fulfillment line item.
      Contains 3.3M rows with shipment details and COGS entries.

    joins:
      - name: items
        relationship: many_to_one
        sql: "{CUBE}.item = {items}.item_id"

      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations}.location_id"

      - name: departments
        relationship: many_to_one
        sql: "{CUBE}.department = {departments}.department_id"

    measures:
      - name: item_fulfillment_line_count
        type: count
        description: Total number of fulfillment line items

      - name: total_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: sum
        description: Total quantity fulfilled across all lines

      - name: total_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: sum
        format: currency
        description: Total amount across all fulfillment lines

      - name: total_netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total net amount (excluding tax)

      - name: total_taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total tax amount

      - name: total_grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total gross amount (including tax)

      - name: total_foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total foreign currency amount

      - name: total_line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: sum
        format: currency
        description: Total revenue from fulfillment lines

      - name: avg_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: avg
        description: Average quantity per fulfillment line

      - name: avg_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: avg
        format: currency
        description: Average amount per fulfillment line

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        description: Line ID (part of composite key with transaction)

      - name: transaction
        sql: "{CUBE}.transaction"
        type: number
        description: Transaction ID (fulfillment header reference)

      - name: item
        sql: "{CUBE}.item"
        type: number
        description: Item ID (product reference)

      - name: quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: number
        description: Quantity fulfilled on this line

      - name: rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: number
        description: Unit rate/price

      - name: amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: number
        description: Line amount

      - name: netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: number
        description: Net amount (excluding tax)

      - name: taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: number
        description: Tax amount

      - name: grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: number
        description: Gross amount (including tax)

      - name: foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: number
        description: Foreign currency amount

      - name: location
        sql: "{CUBE}.location"
        type: number
        description: Location ID (warehouse/fulfillment center)

      - name: class
        sql: "{CUBE}.class"
        type: number
        description: Class ID (business classification)

      - name: department
        sql: "{CUBE}.department"
        type: number
        description: Department ID

      - name: isclosed
        sql: "{CUBE}.isclosed"
        type: boolean
        description: Indicates if fulfillment line is closed

      - name: iscogs
        sql: "{CUBE}.iscogs"
        type: boolean
        description: Indicates if this is a COGS (cost of goods sold) line

      - name: memo
        sql: "{CUBE}.memo"
        type: number
        description: Memo reference ID

      - name: is_sales_line
        sql: "{CUBE}.is_sales_line"
        type: boolean
        description: Indicates if this is a revenue/sales line

      - name: line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: number
        description: Revenue amount for this line

    segments:
      - name: revenue_lines
        sql: "{CUBE}.is_sales_line = true"
        description: "Revenue/sales lines only (excludes COGS entries)"

      - name: cogs_lines
        sql: "{CUBE}.iscogs = true"
        description: "COGS (cost of goods sold) lines only"

      - name: closed_lines
        sql: "{CUBE}.isclosed = true"
        description: "Closed fulfillment lines"

      - name: open_lines
        sql: "{CUBE}.isclosed = false"
        description: "Open fulfillment lines"

    pre_aggregations:
      - name: fulfillment_daily_summary
        type: rollup
        external: true
        measures:
          - item_fulfillment_line_count
          - total_quantity
          - total_amount
          - total_netamount
          - total_line_revenue
        dimensions:
          - item
          - location
          - department
          - iscogs
          - is_sales_line
        refresh_key:
          every: "24 hour"
