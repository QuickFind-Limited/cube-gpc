cubes:
  - name: item_receipt_line
    sql_table: gpc_data_2026_01_26.item_receipt_line
    title: Item Receipt Lines
    description: >
      Item receipt line-level detail for vendor receipts and returns.
      Grain: one row per item receipt line.

    joins:
      - name: items
        relationship: many_to_one
        sql: "{CUBE}.item = {items}.item_id"

      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations}.location_id"

      - name: departments
        relationship: many_to_one
        sql: "{CUBE}.department = {departments}.department_id"

    measures:
      - name: item_receipt_line_count
        type: count
        description: Total number of item receipt lines

      - name: total_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: sum
        description: Total quantity received (positive for receipts, negative for returns)

      - name: total_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: sum
        format: currency
        description: Total receipt amount

      - name: total_netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total net amount

      - name: total_taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total tax amount

      - name: total_grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total gross amount

      - name: total_foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total foreign currency amount

      - name: total_line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: sum
        format: currency
        description: Total line revenue

      - name: avg_rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: avg
        description: Average receipt rate per unit

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        description: Line identifier (composite key with transaction)

      - name: transaction
        sql: "{CUBE}.transaction"
        type: number
        description: Transaction ID reference

      - name: item
        sql: "{CUBE}.item"
        type: number
        description: Item ID foreign key

      - name: quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: number
        description: Quantity received (positive for receipts, negative for returns)

      - name: rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: number
        description: Unit rate/cost

      - name: amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: number
        description: Line amount

      - name: netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: number
        description: Net line amount

      - name: taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: number
        description: Tax amount for this line

      - name: grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: number
        description: Gross line amount

      - name: foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: number
        description: Amount in foreign currency

      - name: location
        sql: "{CUBE}.location"
        type: number
        description: Receiving location ID

      - name: class
        sql: "{CUBE}.class"
        type: number
        description: Class dimension ID

      - name: department
        sql: "{CUBE}.department"
        type: number
        description: Department ID foreign key

      - name: isclosed
        sql: "{CUBE}.isclosed"
        type: boolean
        description: Indicates if line is closed

      - name: iscogs
        sql: "{CUBE}.iscogs"
        type: boolean
        description: Indicates if this is a COGS line (vs inventory line)

      - name: memo
        sql: "{CUBE}.memo"
        type: number
        description: Memo field identifier

      - name: is_sales_line
        sql: "{CUBE}.is_sales_line"
        type: boolean
        description: Indicates if this is a sales line

      - name: line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: number
        description: Revenue attributed to this line

    segments:
      - name: inventory_lines
        sql: "{CUBE}.iscogs = false"
        description: "Inventory receipt lines only (excludes COGS adjustment lines)"

      - name: cogs_lines
        sql: "{CUBE}.iscogs = true"
        description: "COGS adjustment lines only"

      - name: receipts_only
        sql: "CAST({CUBE}.quantity AS FLOAT64) > 0"
        description: "Positive quantity receipts (excludes returns)"

      - name: returns_only
        sql: "CAST({CUBE}.quantity AS FLOAT64) < 0"
        description: "Negative quantity returns to vendor"

    pre_aggregations:
      - name: daily_receipts
        type: rollup
        external: true
        measures:
          - item_receipt_line_count
          - total_quantity
          - total_amount
          - total_netamount
        dimensions:
          - iscogs
          - isclosed
        refresh_key:
          every: "24 hour"
