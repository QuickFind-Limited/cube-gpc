cubes:
  - name: transaction_lines
    sql_table: gpc_data_2026_01_26.transaction_lines
    title: Transaction Lines
    description: "Line items from all transactions - the main fact table for metrics. Grain: one row per transaction line (all transaction types combined)."

    joins:
      - name: transactions
        relationship: many_to_one
        sql: "{CUBE}.transaction = {transactions}.id"

      - name: items
        relationship: many_to_one
        sql: "{CUBE}.item = {items}.item_id"

      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations}.location_id"

      - name: departments
        relationship: many_to_one
        sql: "{CUBE}.department = {departments}.department_id"

    measures:
      - name: transaction_lines_count
        type: count
        description: Total number of transaction lines

      - name: total_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: sum
        description: Total quantity across all lines

      - name: total_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: sum
        format: currency
        description: Total amount across all lines

      - name: total_netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total net amount across all lines

      - name: total_taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total tax amount across all lines

      - name: total_grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total gross amount across all lines

      - name: total_foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total foreign amount across all lines

      - name: total_line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: sum
        format: currency
        description: Total line revenue across all lines

      - name: total_rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: sum
        description: Total rate across all lines

      - name: transaction_count
        sql: "{CUBE}.transaction"
        type: count_distinct_approx
        description: "Number of unique transactions (approximate count using HyperLogLog)"

      - name: sku_count
        sql: "{CUBE}.item"
        type: count_distinct_approx
        description: Number of unique SKUs

      - name: average_quantity_per_line
        sql: "1.0 * {total_quantity} / NULLIF({transaction_lines_count}, 0)"
        type: number
        description: Average quantity per line item

      - name: average_amount_per_line
        sql: "1.0 * {total_amount} / NULLIF({transaction_lines_count}, 0)"
        type: number
        format: currency
        description: Average amount per line item

      - name: average_lines_per_transaction
        sql: "1.0 * {transaction_lines_count} / NULLIF({transaction_count}, 0)"
        type: number
        description: Average number of lines per transaction

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        description: Line item ID (part of composite key with transaction)

      - name: transaction
        sql: "{CUBE}.transaction"
        type: number
        description: Transaction ID (foreign key to transactions table)

      - name: item
        sql: "{CUBE}.item"
        type: number
        description: Item ID (foreign key to items table)

      - name: quantity
        sql: "{CUBE}.quantity"
        type: number
        description: Quantity (negative for sales, positive for returns)

      - name: rate
        sql: "{CUBE}.rate"
        type: number
        description: Unit rate/price

      - name: amount
        sql: "{CUBE}.amount"
        type: number
        description: Line amount

      - name: netamount
        sql: "{CUBE}.netamount"
        type: number
        description: Net amount after discounts

      - name: taxamount
        sql: "{CUBE}.taxamount"
        type: number
        description: Tax amount

      - name: grossamount
        sql: "{CUBE}.grossamount"
        type: number
        description: Gross amount including tax

      - name: foreignamount
        sql: "{CUBE}.foreignamount"
        type: number
        description: Amount in foreign currency

      - name: location
        sql: "{CUBE}.location"
        type: number
        description: Location ID (foreign key to locations table)

      - name: class
        sql: "{CUBE}.class"
        type: number
        description: Class/classification ID

      - name: department
        sql: "{CUBE}.department"
        type: number
        description: Department ID (foreign key to departments table)

      - name: isclosed
        sql: "{CUBE}.isclosed"
        type: boolean
        description: Indicates if the line is closed

      - name: iscogs
        sql: "{CUBE}.iscogs"
        type: boolean
        description: Indicates if this is a COGS (cost of goods sold) line

      - name: memo
        sql: "{CUBE}.memo"
        type: number
        description: Memo field reference

      - name: is_sales_line
        sql: "{CUBE}.is_sales_line"
        type: boolean
        description: Indicates if this is a sales line

      - name: line_revenue
        sql: "{CUBE}.line_revenue"
        type: number
        description: Revenue amount for this line

    segments:
      - name: has_item
        sql: "{CUBE}.item IS NOT NULL"
        description: "Lines with an associated item"

      - name: positive_quantity
        sql: "{CUBE}.quantity > 0"
        description: "Lines with positive quantity (typically returns)"

      - name: negative_quantity
        sql: "{CUBE}.quantity < 0"
        description: "Lines with negative quantity (typically sales)"

      - name: sales_lines_only
        sql: "{CUBE}.is_sales_line = true"
        description: "Sales lines only (excludes COGS and other non-sales lines)"

      - name: cogs_lines_only
        sql: "{CUBE}.iscogs = true"
        description: "COGS lines only"

    pre_aggregations:
      - name: daily_summary
        type: rollup
        external: true
        measures:
          - transaction_lines_count
          - total_quantity
          - total_amount
          - total_line_revenue
          - transaction_count
        dimensions:
          - iscogs
          - is_sales_line
        granularity: day
        partition_granularity: month
        refresh_key:
          every: 24 hour
