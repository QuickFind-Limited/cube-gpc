cubes:
  - name: cashrefund_line
    sql_table: gpc_data_2026_01_26.cashrefund_line
    title: Cash Refund Lines
    description: >
      Cash refund transaction line items. Contains POS cash refund details including amounts, quantities, and COGS entries.
      Grain: one row per cash refund line item.

    joins:
      - name: items
        relationship: many_to_one
        sql: "{CUBE}.item = {items}.item_id"

      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations}.location_id"

      - name: departments
        relationship: many_to_one
        sql: "{CUBE}.department = {departments}.department_id"

    measures:
      - name: cashrefund_line_count
        type: count
        description: Total number of cash refund lines

      - name: total_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: sum
        description: Total quantity of items refunded

      - name: total_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: sum
        format: currency
        description: Total refund amount

      - name: total_netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total net amount (before tax)

      - name: total_taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total tax amount on refunds

      - name: total_grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total gross amount including tax

      - name: total_foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total amount in foreign currency

      - name: total_line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: sum
        format: currency
        description: Total line revenue (negative for refunds)

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        description: Line item identifier (part of composite key with transaction)

      - name: transaction
        sql: "{CUBE}.transaction"
        type: number
        description: Transaction header ID reference

      - name: item
        sql: "{CUBE}.item"
        type: number
        description: Item/product ID

      - name: quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: number
        description: Quantity refunded

      - name: rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: number
        description: Unit price/rate

      - name: amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: number
        description: Line amount

      - name: netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: number
        description: Net amount before tax

      - name: taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: number
        description: Tax amount

      - name: grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: number
        description: Gross amount including tax

      - name: foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: number
        description: Amount in foreign currency

      - name: location
        sql: "{CUBE}.location"
        type: number
        description: Location ID (warehouse/store)

      - name: class
        sql: "{CUBE}.class"
        type: number
        description: Class ID for classification

      - name: department
        sql: "{CUBE}.department"
        type: number
        description: Department ID

      - name: isclosed
        sql: "{CUBE}.isclosed"
        type: boolean
        description: Indicates if line is closed

      - name: iscogs
        sql: "{CUBE}.iscogs"
        type: boolean
        description: Indicates if this is a COGS (cost of goods sold) line

      - name: memo
        sql: "{CUBE}.memo"
        type: number
        description: Memo reference ID

      - name: is_sales_line
        sql: "{CUBE}.is_sales_line"
        type: boolean
        description: Indicates if this is a sales line (vs COGS or tax)

      - name: line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: number
        description: Revenue for this line

    segments:
      - name: sales_lines_only
        sql: "{CUBE}.is_sales_line = TRUE"
        description: "Excludes COGS and tax lines for accurate revenue metrics"

      - name: cogs_lines_only
        sql: "{CUBE}.iscogs = TRUE"
        description: "COGS lines only for cost analysis"

      - name: non_cogs_lines
        sql: "{CUBE}.iscogs = FALSE"
        description: "Excludes COGS lines for customer-facing refund analysis"
