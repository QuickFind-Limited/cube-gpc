cubes:
  - name: deposit_application_line
    sql_table: gpc_data_2026_01_26.deposit_application_line
    title: Deposit Application Lines
    description: >
      Deposit application line items linking customer deposits to invoices.
      Grain: one row per deposit application line item.
      Note: All amounts are negative (deposit application convention). 98.6% webstore entity contamination.

    joins:
      - name: items
        relationship: many_to_one
        sql: "{CUBE}.item = {items.item_id}"

      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations.location_id}"

      - name: departments
        relationship: many_to_one
        sql: "{CUBE}.department = {departments.department_id}"

    measures:
      - name: deposit_application_line_count
        type: count
        description: Total number of deposit application lines

      - name: total_quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: sum
        description: Total quantity across all deposit application lines

      - name: total_amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: sum
        format: currency
        description: Total amount (negative values indicate deposit applications)

      - name: total_amount_abs
        sql: "ABS(CAST({CUBE}.amount AS FLOAT64))"
        type: sum
        format: currency
        description: Total absolute amount (for reporting deposit application volume)

      - name: total_netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total net amount after discounts

      - name: total_taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total tax amount

      - name: total_grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total gross amount

      - name: total_foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: sum
        format: currency
        description: Total amount in foreign currency

      - name: total_line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: sum
        format: currency
        description: Total line revenue

      - name: avg_rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: avg
        description: Average rate across deposit application lines

    dimensions:
      - name: id
        sql: "{CUBE}.id"
        type: number
        primary_key: true
        description: Line item ID (part of composite key with transaction)

      - name: transaction
        sql: "{CUBE}.transaction"
        type: number
        description: Transaction ID (foreign key to deposit application header)

      - name: item
        sql: "{CUBE}.item"
        type: number
        description: Item ID (foreign key to items)

      - name: quantity
        sql: "CAST({CUBE}.quantity AS FLOAT64)"
        type: number
        description: Line item quantity

      - name: rate
        sql: "CAST({CUBE}.rate AS FLOAT64)"
        type: number
        description: Unit rate or price

      - name: amount
        sql: "CAST({CUBE}.amount AS FLOAT64)"
        type: number
        description: Line amount (negative for deposit applications)

      - name: netamount
        sql: "CAST({CUBE}.netamount AS FLOAT64)"
        type: number
        description: Net amount after discounts

      - name: taxamount
        sql: "CAST({CUBE}.taxamount AS FLOAT64)"
        type: number
        description: Tax amount for this line

      - name: grossamount
        sql: "CAST({CUBE}.grossamount AS FLOAT64)"
        type: number
        description: Gross amount including all charges

      - name: foreignamount
        sql: "CAST({CUBE}.foreignamount AS FLOAT64)"
        type: number
        description: Amount in foreign currency

      - name: location
        sql: "{CUBE}.location"
        type: number
        description: Location ID (foreign key to locations)

      - name: class
        sql: "{CUBE}.class"
        type: number
        description: Class ID for accounting classification

      - name: department
        sql: "{CUBE}.department"
        type: number
        description: Department ID (foreign key to departments)

      - name: isclosed
        sql: "{CUBE}.isclosed"
        type: boolean
        description: Indicates if the line is closed

      - name: iscogs
        sql: "{CUBE}.iscogs"
        type: boolean
        description: Indicates if this is a COGS line

      - name: memo
        sql: "{CUBE}.memo"
        type: number
        description: Memo reference ID

      - name: is_sales_line
        sql: "{CUBE}.is_sales_line"
        type: boolean
        description: Indicates if this is a sales line

      - name: line_revenue
        sql: "CAST({CUBE}.line_revenue AS FLOAT64)"
        type: number
        description: Revenue attributed to this line

    segments:
      - name: sales_lines_only
        sql: "{CUBE}.is_sales_line = TRUE"
        description: "Filter to sales lines only (excludes COGS and tax lines)"

      - name: cogs_lines_only
        sql: "{CUBE}.iscogs = TRUE"
        description: "Filter to COGS lines only"

      - name: closed_lines
        sql: "{CUBE}.isclosed = TRUE"
        description: "Filter to closed lines only"

      - name: open_lines
        sql: "{CUBE}.isclosed = FALSE"
        description: "Filter to open lines only"

    pre_aggregations:
      - name: daily_summary
        type: rollup
        external: true
        measures:
          - deposit_application_line_count
          - total_amount
          - total_netamount
          - total_taxamount
          - total_line_revenue
        dimensions:
          - isclosed
          - iscogs
          - is_sales_line
        refresh_key:
          every: "24 hour"
