# redeploy_stamp: 2026-02-23T041500Z
cubes:
  - name: inventory_turnover_proxy
    sql: >
      WITH month_calendar AS (
        SELECT month_date
        FROM UNNEST(
          GENERATE_DATE_ARRAY(DATE '2024-11-01', DATE '2025-10-01', INTERVAL 1 MONTH)
        ) AS month_date
      ),
      sales_monthly AS (
        SELECT
          item,
          location,
          COALESCE(NULLIF(TRIM(season), ''), 'UNKNOWN') AS season,
          COALESCE(NULLIF(TRIM(category), ''), 'UNKNOWN') AS category,
          DATE_TRUNC(transaction_date, MONTH) AS analysis_month,
          SUM(
            CASE
              WHEN transaction_type IN ('CustInvc', 'CashSale') AND quantity < 0
                THEN quantity * -1
              ELSE 0
            END
          ) AS units_sold_month
        FROM gpc_prod_native_v1.transaction_lines_denormalized_mv
        WHERE transaction_date BETWEEN DATE '2024-11-01' AND DATE '2025-10-31'
        GROUP BY 1, 2, 3, 4, 5
      ),
      stock_snapshot AS (
        SELECT
          ic.item,
          ic.location,
          COALESCE(NULLIF(TRIM(i.custitem_gpc_season), ''), 'UNKNOWN') AS season,
          COALESCE(NULLIF(TRIM(i.custitem_gpc_category), ''), 'UNKNOWN') AS category,
          SAFE_CAST(ic.calculated_quantity_available AS FLOAT64) AS available_stock_snapshot
        FROM gpc_prod_native_v1.inventory_calculated ic
        LEFT JOIN gpc_prod_native_v1.items i
          ON ic.item = i.id
      ),
      stock_month_grid AS (
        SELECT
          st.item,
          st.location,
          st.season,
          st.category,
          st.available_stock_snapshot,
          mc.month_date AS analysis_month
        FROM stock_snapshot st
        CROSS JOIN month_calendar mc
      )
      SELECT
        COALESCE(s.item, g.item) AS item,
        COALESCE(s.location, g.location) AS location,
        COALESCE(s.season, g.season) AS season,
        COALESCE(s.category, g.category) AS category,
        COALESCE(s.analysis_month, g.analysis_month) AS analysis_month,
        COALESCE(s.units_sold_month, 0.0) AS units_sold_month,
        COALESCE(g.available_stock_snapshot, 0.0) AS available_stock_snapshot,
        DATE '2024-11-01' AS sales_window_start,
        DATE '2025-10-31' AS sales_window_end,
        DATE '2025-10-31' AS snapshot_date
      FROM sales_monthly s
      FULL OUTER JOIN stock_month_grid g
        ON s.item = g.item
       AND s.location = g.location
       AND s.season = g.season
       AND s.category = g.category
       AND s.analysis_month = g.analysis_month

    title: Inventory Turnover Proxy
    description: >
      INV002 dedicated proxy model at season x category x location grain.
      Numerator is units sold in fixed operational window 2024-11-01 to 2025-10-31.
      Denominator is current snapshot stock (as of 2025-10-31). This is a proxy turnover lens, not true average-inventory turnover.

    joins:
      - name: locations
        relationship: many_to_one
        sql: "{CUBE}.location = {locations.id}"

    measures:
      - name: position_count
        type: count
        description: Number of item-location-season-category positions in the turnover proxy model.

      - name: units_sold_month
        sql: "{CUBE}.units_sold_month"
        type: sum
        description: Units sold in each analysis month (sales-only numerator component).

      - name: units_sold_window
        sql: "{CUBE}.units_sold_month"
        type: sum
        description: Units sold in fixed analysis window (2024-11-01 to 2025-10-31).

      - name: available_stock_snapshot
        sql: "{CUBE}.available_stock_snapshot"
        type: sum
        description: Snapshot stock level at 2025-10-31, repeated per month row for trendability.

      - name: available_stock_positive
        sql: "{CUBE}.available_stock_snapshot"
        type: sum
        filters:
          - sql: "{CUBE}.available_stock_snapshot > 0"
        description: Positive snapshot stock, repeated per month row.

      - name: month_count
        sql: "{CUBE}.analysis_month"
        type: count_distinct
        description: Number of distinct analysis months included in query scope.

      - name: available_stock_positive_normalized
        sql: "1.0 * {available_stock_positive} / NULLIF({month_count}, 0)"
        type: number
        description: Month-normalized positive stock denominator.

      - name: turnover_proxy
        sql: "1.0 * {units_sold_window} / NULLIF({available_stock_positive_normalized}, 0)"
        type: number
        description: INV002 proxy turnover = units_sold_window / positive snapshot stock.

      - name: turnover_proxy_month
        sql: "1.0 * {units_sold_month} / NULLIF({available_stock_positive}, 0)"
        type: number
        description: Monthly proxy turnover using month-level units sold and snapshot denominator.

    dimensions:
      - name: id
        sql: >
          CONCAT(
            CAST({CUBE}.item AS STRING), '-',
            CAST({CUBE}.location AS STRING), '-',
            COALESCE({CUBE}.season, 'UNKNOWN'), '-',
            COALESCE({CUBE}.category, 'UNKNOWN'), '-',
            CAST({CUBE}.analysis_month AS STRING)
          )
        type: string
        primary_key: true

      - name: item
        sql: "{CUBE}.item"
        type: number
        description: Item ID.

      - name: location
        sql: "{CUBE}.location"
        type: number
        description: Location ID.

      - name: location_name
        sql: "{locations.name}"
        type: string
        description: Location name (from locations cube).

      - name: channel_type
        sql: "{locations.channel_type}"
        type: string
        description: Channel type derived from location mapping.

      - name: season
        sql: "{CUBE}.season"
        type: string
        description: Season key used for turnover proxy grouping.

      - name: category
        sql: "{CUBE}.category"
        type: string
        description: Category used for turnover proxy grouping.

      - name: analysis_month
        sql: "CAST({CUBE}.analysis_month AS TIMESTAMP)"
        type: time
        description: Analysis month used for INV002 trend/YoY proxy outputs.

      - name: sales_window_start
        sql: "CAST({CUBE}.sales_window_start AS TIMESTAMP)"
        type: time
        description: Start date of fixed sales analysis window.

      - name: sales_window_end
        sql: "CAST({CUBE}.sales_window_end AS TIMESTAMP)"
        type: time
        description: End date of fixed sales analysis window.

      - name: snapshot_date
        sql: "CAST({CUBE}.snapshot_date AS TIMESTAMP)"
        type: time
        description: Snapshot date for denominator stock (fixed at 2025-10-31).

    pre_aggregations:
      - name: turnover_by_season_category_location
        measures:
          - units_sold_month
          - units_sold_window
          - available_stock_snapshot
          - available_stock_positive
          - month_count
          - position_count
        dimensions:
          - season
          - category
          - location
          - locations.name
          - locations.channel_type
        time_dimension: analysis_month
        granularity: month
        partition_granularity: month
        refresh_key:
          every: 365 days
